<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galería de Productos - Café</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="logo" title="Ir a inicio">
        <span>☕</span>
        <strong>Café central</strong>
        </div>

        <nav class="barra-navegacion">
            <a href="#galeria" class="nav-link">Productos</a>
            <a href="#contacto" class="nav-link">Contacto</a>
            
        </nav>
    </header>

    <main>
        <h1>Galeria de productos</h1>
        <section id="galeria" class="galeria-productos">
            <!-- Tarjeta de producto con clase y atributos alt, title en imagen -->
            <div class="card-producto">
                <img src="https://images.unsplash.com/photo-1511920170033-f8396924c348?auto=format&fit=crop&w=300&q=80"
                     alt="Pan artesanal" title="Pan artesanal recién horneado" class="img-producto">
                <h3>Pan Artesanal</h3>
            </div>
            <div class="card-producto">
                <img src="https://images.unsplash.com/photo-1732542347785-f9d6d53df15e?w=800&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8NHx8Y2FmZmUlMjBsYXR0ZXxlbnwwfHwwfHx8MA%3D%3D"
                     alt="Café latte" title="Café latte clásico" class="img-producto">
                <h3>Café Latte</h3>
            </div>
            <div class="card-producto">
                <img src="https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=300&q=80"
                     alt="Pastel de chocolate" title="Delicioso pastel de chocolate" class="img-producto">
                <h3>Pastel de Chocolate</h3>
            </div>
            <div class="card-producto">
                <img src="https://images.unsplash.com/photo-1470337458703-46ad1756a187?auto=format&fit=crop&w=300&q=80"
                     alt="Té verde orgánico" title="Té verde 100% orgánico" class="img-producto">
                <h3>Té Verde Orgánico</h3>
            </div>
        </section>
    </main>

    <footer id="contacto">
        <p>
            Calle café 123, Centro Histórico <br>
            555-123-4567 | café@central.com
        </p>

        <div class="redes">
            <a href="#" title="Instagram Café Central">Instagram</a>
            <a href="#" title="Facebook Café Central">Facebook</a>
        </div>
    </footer>
</body>
</html>
