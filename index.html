<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Presentación de rei</title>
  <link rel="icon" type="image/x-icon" href="https://thelegendofzelda.club/wp-content/uploads/2023/04/logo-trifuerza.png">
  <style>
    body {
      background: #f5f0fa;
      font-family: 'Segoe UI', Arial, sans-serif;
      display: flex;
      height: 100vh;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(43,88,245,0.15);
      padding: 2rem;
      max-width: 340px;
      text-align: center;
      margin-bottom: 20px;
    }
    .card2 {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(43,88,245,0.15);
      padding: 2rem;
      max-width: 340px;
      text-align: center;
      margin-top: 30px;
    }
    .card img {
      width: 100px;
      height: 100px;
      border-radius: 50%;
      border: 3px solid #682bf5;
      margin-bottom: 1rem;
      object-fit: cover;
    }
    .card2 img {
      width: 100px;
      height: 100px;
      border-radius: 100%;
      border: 3px solid #682bf5;
      margin-bottom: 1rem;
      object-fit: cover;
    }
    .card h1 {
      color: #4d1d6b;
      margin: 0.5rem 0 1rem 0;
      font-size: 1.6rem;
    }
    .interests {
      list-style: none;
      padding: 0;
      margin: 1rem 0;
    }
    .interests li {
      background: #e3eafd;
      color: #682bf5;
      margin: 0.5rem 0;
      border-radius: 8px;
      padding: 0.3rem 1rem;
      display: inline-block;
    }
    .card a {
      text-decoration: none;
      color: #fff;
      background: #682bf5;
      padding: 0.5rem 1rem;
      border-radius: 8px;
      margin-top: 1rem;
      display: inline-block;
      font-weight: bold;
      transition: background 0.2s;
    }
    .card a:hover {
      background: #172c6a;
    }
  </style>
</head>
<body>
  <div class="card">
    <img src="https://avatars.fastly.steamstatic.com/033ca92ec1d9abe84324bb8bcc545ec76977c0a9_full.jpg" alt="Avatar">
    <h1>Juan Aguilar (rei)</h1>
    <p>Me gusta mucho jugar videojuegos y escuchar música. Mis videojuegos favoritos son los RPG, y mi artista favorito es Duki. Últimamente he adquirido el gusto por ver películas y series.</p>
    <ul class="interests">
      <li>Videojuegos</li>
      <li>Música</li>
      <li>Peliculas</li>
      <li>Series</li>
    </ul>
    <a href="https://open.spotify.com/user/21sylghty43ydofksrpiwv4sy?si=1880dd044c704d76" target="_blank">Spotify</a>
    <a href="https://steamcommunity.com/id/Reysku/" target="blank">Steam</a>
    <div class="card2">
        <img src="" alt="" class="card2">
    </div>
  </div>
</body>
</html>
